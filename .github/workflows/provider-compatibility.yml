name: Real Provider Compatibility

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-smoke:
    runs-on: ubuntu-latest
    env:
      PROVIDER_SMOKE_ENABLED: ${{ secrets.OPENCROW_PROVIDER_SMOKE_ENABLED }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest -r services/constellation/requirements-runtime.txt -r packages/mcp/requirements-web-proxy.txt
      - name: Install current provider CLIs through vendor-owned channels
        run: |
          npm install --global @openai/codex @opencode/cli@2.1.4 @anthropic-ai/claude-code
          npm ci --prefix packages/opencode
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          printf '%s/.local/bin\n' "$HOME" >> "$GITHUB_PATH"
      - name: Verify discovery, native formats, integrations, and lifecycle registration
        run: |
          python scripts/build_releases.py --allow-development-placeholders
          bash scripts/test_provider_runtime_skills.sh dist/opencrow-skills.zip
          pytest -q packages/lifecycle/tests packages/mcp/tests installer/tests services/constellation/tests
      - name: Exercise the real pinned embedded SDK and connected V2 client
        run: bash scripts/test_opencode_v2.sh
      - name: Optional authenticated minimal turns
        if: ${{ env.PROVIDER_SMOKE_ENABLED == 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCROW_OPENCODE_SMOKE_MODEL: ${{ vars.OPENCROW_OPENCODE_SMOKE_MODEL }}
        run: bash scripts/provider_authenticated_smoke.sh
