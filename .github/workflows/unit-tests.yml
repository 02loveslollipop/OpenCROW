name: Unit Tests

on:
  push:
    branches: ["feature/**", dev, main, release]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: npm ci --prefix packages/opencode
      - run: python -m pip install --upgrade pip pytest -r services/constellation/requirements.txt -r packages/mcp/requirements-web-proxy.txt
      - run: make test
