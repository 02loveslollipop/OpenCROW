name: PR Verification

on:
  pull_request:
    branches: [dev, main, release]

permissions:
  contents: read

jobs:
  tests-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest -r services/constellation/requirements-runtime.txt
      - run: make test
      - run: make smoke
      - uses: actions/cache@v4
        with:
          path: .cache/docs-external-links.json
          key: docs-external-${{ hashFiles('**/*.md') }}
          restore-keys: docs-external-
      - run: python scripts/validate_docs.py --check-external
      - run: bash scripts/test_installation_e2e.sh

  distro-selection:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:24.04
            arch: x86_64
          - image: fedora:42
            arch: x86_64
          - image: archlinux:latest
            arch: aarch64
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Exercise dependency-free selector and architecture path
        env:
          OPENCROW_TEST_MACHINE: ${{ matrix.arch }}
        run: bash installer/install.sh --agents codex --toolboxes utility --no-miniconda --yes --dry-run
