name: PR Verification

on:
  pull_request:
    branches: [ main, master ]

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: true
          activate-environment: ""
          python-version: "3.12"

      - name: Install Pytest & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest requests tornado flask pymongo typer rich

      - name: Run Unit Tests
        run: pytest

      - name: Run Smoke Verification
        run: make smoke ENV=ctf

      - name: Run Lightweight E2E Installation & Functionality Test
        run: bash scripts/test_installation_e2e.sh
