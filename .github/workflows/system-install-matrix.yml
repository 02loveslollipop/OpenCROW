name: Actual Linux Installation Matrix

on:
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "fedora:42", "archlinux:latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test actual full and skills-only installation
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/workspace:ro"
          "${{ matrix.image }}"
          bash /workspace/scripts/test_system_install.sh /workspace
