name: Deploy Release

on:
  push:
    branches: [ main, master ]
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pytest & Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest requests tornado flask pymongo typer rich

      - name: Run Verification
        run: pytest && make smoke ENV=ctf

      - name: Build Release Packages
        run: python3 scripts/build_releases.py

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/opencrow-cli.zip
            dist/opencrow-constellation.zip
          draft: false
          prerelease: false
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest OpenCROW Release' }}
          generate_release_notes: true
