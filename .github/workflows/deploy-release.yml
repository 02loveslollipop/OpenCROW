name: Stable Release Transaction

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WIKI_DEPLOY_TOKEN: ${{ secrets.WIKI_DEPLOY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PORTABLE_X86_URL: ${{ vars.PORTABLE_PYTHON_X86_URL }}
      PORTABLE_X86_SHA256: ${{ vars.PORTABLE_PYTHON_X86_SHA256 }}
      PORTABLE_ARM64_URL: ${{ vars.PORTABLE_PYTHON_ARM64_URL }}
      PORTABLE_ARM64_SHA256: ${{ vars.PORTABLE_PYTHON_ARM64_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate stable annotated tag on release branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]
          [[ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" == tag ]]
          git fetch origin release
          SOURCE_SHA=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *+* ]]; then
            BUILD_METADATA=${GITHUB_REF_NAME#*+}
            [[ "$BUILD_METADATA" == *"${SOURCE_SHA:0:12}"* || "$BUILD_METADATA" == *"$SOURCE_SHA"* ]]
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" origin/release
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Validate code and documentation
        run: |
          python -m pip install --upgrade pip pytest -r services/constellation/requirements-runtime.txt
          make test
          make smoke
          python scripts/validate_docs.py --check-external

      - name: Exercise actual full and skills-only installs across supported distro families
        run: bash scripts/test_distro_matrix.sh

      - name: Fetch and verify portable CPython inputs
        shell: bash
        run: |
          set -euo pipefail
          : "${PORTABLE_X86_URL:?configure PORTABLE_PYTHON_X86_URL}"
          : "${PORTABLE_X86_SHA256:?configure PORTABLE_PYTHON_X86_SHA256}"
          : "${PORTABLE_ARM64_URL:?configure PORTABLE_PYTHON_ARM64_URL}"
          : "${PORTABLE_ARM64_SHA256:?configure PORTABLE_PYTHON_ARM64_SHA256}"
          curl -fsSL "$PORTABLE_X86_URL" -o /tmp/python-x86.tar.gz
          curl -fsSL "$PORTABLE_ARM64_URL" -o /tmp/python-arm64.tar.gz
          printf '%s  %s\n' "$PORTABLE_X86_SHA256" /tmp/python-x86.tar.gz | sha256sum -c -
          printf '%s  %s\n' "$PORTABLE_ARM64_SHA256" /tmp/python-arm64.tar.gz | sha256sum -c -

      - name: Build verified release assets and Wiki snapshot
        run: |
          python scripts/build_releases.py \
            --version "$GITHUB_REF_NAME" \
            --release-tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --portable-python-x86 /tmp/python-x86.tar.gz \
            --portable-python-arm64 /tmp/python-arm64.tar.gz \
            --require-release-ready
          git diff --exit-code

      - name: Create draft GitHub Release and upload assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "OpenCROW $GITHUB_REF_NAME" --generate-notes
          fi
          mapfile -t ASSETS < <(find dist -maxdepth 1 -type f -print | sort)
          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber

      - name: Synchronize generated Wiki using dedicated credential
        shell: bash
        run: |
          set -euo pipefail
          : "${WIKI_DEPLOY_TOKEN:?WIKI_DEPLOY_TOKEN is required}"
          python scripts/publish_wiki.py \
            --generated dist/wiki \
            --repository "https://x-access-token:${WIKI_DEPLOY_TOKEN}@github.com/02loveslollipop/OpenCROW.wiki.git" \
            --version "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA"

      - name: Publish GitHub Release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Advance Cloudflare stable installer pointers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-pages --project-name opencrow --branch release
